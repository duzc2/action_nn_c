<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action NN-C Network Editor</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="toolbar">
        <span class="logo">NN-C Editor</span>
        <div class="toolbar-buttons">
            <button onclick="addNode('input')" class="toolbar-btn">[+Input]</button>
            <button onclick="addNode('mlp')" class="toolbar-btn">[+MLP]</button>
            <button onclick="addNode('output')" class="toolbar-btn">[+Output]</button>
            <div class="separator"></div>
            <button onclick="exportJSON()" class="toolbar-btn primary">Export JSON</button>
            <button onclick="exportC()" class="toolbar-btn primary">Export C</button>
        </div>
    </div>
    <div id="editor"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
